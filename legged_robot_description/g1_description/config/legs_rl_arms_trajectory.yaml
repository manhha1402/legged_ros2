unitree_node:
  ros__parameters:
    cmd_vel:
      scale:
        lin_vel_x: 0.5
        lin_vel_y: 0.5
        ang_vel_z: 0.5

# ------------------------------------------------------------
# Controller configuration for legs-only RL + arm trajectory control
# - RL controller: 12 leg joints (locomotion/balance)
# - Trajectory controllers: 14 arm joints (manipulation with action servers)
# ------------------------------------------------------------
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    static_controller:
      type: legged_ros2_controller/StaticController

    rl_controller:
      type: legged_rl_controller/LeggedRLController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# Static controller for initialization (legs + waist only for 12-joint policy)
static_controller:
  ros__parameters:
    traj_time: 5.0
    joint_names:
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - left_knee_joint
      - right_knee_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
    joint_cfg:
      left_hip_pitch_joint:
        kp: 100.0
        kd: 2.0
        default_pos: -0.1
      right_hip_pitch_joint:
        kp: 100.0
        kd: 2.0
        default_pos: -0.1
      left_hip_roll_joint:
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      right_hip_roll_joint:
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      left_hip_yaw_joint:
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      right_hip_yaw_joint:
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      left_knee_joint:
        kp: 150.0
        kd: 4.0
        default_pos: 0.3
      right_knee_joint:
        kp: 150.0
        kd: 4.0
        default_pos: 0.3
      left_ankle_pitch_joint:
        kp: 40.0
        kd: 2.0
        default_pos: -0.2
      right_ankle_pitch_joint:
        kp: 40.0
        kd: 2.0
        default_pos: -0.2
      left_ankle_roll_joint:
        kp: 40.0
        kd: 2.0
        default_pos: 0.0
      right_ankle_roll_joint:
        kp: 40.0
        kd: 2.0
        default_pos: 0.0


# RL controller for legs only (12 joints for locomotion/balance)
rl_controller:
  ros__parameters:
    update_rate: 50
    imu_names:
      - imu-pelvis
    range_lin_vel_x: [-1.0, 1.0]
    range_lin_vel_y: [-1.0, 1.0]
    range_ang_vel_z: [-1.0, 1.0]
    
    obs_names:
      - base_ang_vel
      - projected_gravity
      - velocity_commands
      - joint_pos
      - joint_vel
      - actions
    obs_cfg:
      base_ang_vel:
        clip: [0.0]
        scale: 0.2
        history_length: 5
      projected_gravity:
        clip: [0.0]
        scale: 1.0
        history_length: 5
      velocity_commands:
        clip: [0.0]
        scale: 1.0
        history_length: 5
      joint_pos:
        clip: [0.0]
        scale: 1.0
        history_length: 5
      joint_vel:
        clip: [0.0]
        scale: 0.05
        history_length: 5
      actions:
        clip: [0.0]
        scale: 1.0
        history_length: 5
    
    # Only 12 leg joints for RL control
    joint_names:
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - left_knee_joint
      - right_knee_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
    
    action_cfg:
      left_hip_pitch_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: -0.1
      right_hip_pitch_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: -0.1
      left_hip_roll_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      right_hip_roll_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      left_hip_yaw_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      right_hip_yaw_joint:
        clip: [0.0]
        scale: 0.25
        kp: 100.0
        kd: 2.0
        default_pos: 0.0
      left_knee_joint:
        clip: [0.0]
        scale: 0.25
        kp: 150.0
        kd: 4.0
        default_pos: 0.3
      right_knee_joint:
        clip: [0.0]
        scale: 0.25
        kp: 150.0
        kd: 4.0
        default_pos: 0.3
      left_ankle_pitch_joint:
        clip: [0.0]
        scale: 0.25
        kp: 40.0
        kd: 2.0
        default_pos: -0.2
      right_ankle_pitch_joint:
        clip: [0.0]
        scale: 0.25
        kp: 40.0
        kd: 2.0
        default_pos: -0.2
      left_ankle_roll_joint:
        clip: [0.0]
        scale: 0.25
        kp: 40.0
        kd: 2.0
        default_pos: 0.0
      right_ankle_roll_joint:
        clip: [0.0]
        scale: 0.25
        kp: 40.0
        kd: 2.0
        default_pos: 0.0


# Left arm trajectory controller (7 joints) - provides action server
left_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: true
    command_interfaces:
      - position
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0


# Right arm trajectory controller (7 joints) - provides action server
right_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: true
    command_interfaces:
      - position
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0
