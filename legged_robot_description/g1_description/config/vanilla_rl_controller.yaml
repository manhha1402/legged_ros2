unitree_node:
  ros__parameters:
    cmd_vel:
      publish: true
      scale:
        lin_vel_x: 0.3
        lin_vel_y: 0.3
        ang_vel_z: 0.2

# ------------------------------------------------------------
# Configurations for the ROS 2 controller manager
# ------------------------------------------------------------
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    static_controller:
      type: legged_ros2_controller/StaticController

    rl_controller_legs:
      type: legged_rl_controller/LeggedRLController

    rl_controller_whole:
      type: legged_rl_controller/LeggedRLController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# -----------------
# Static Controller
# -----------------
static_controller:
  ros__parameters:
    traj_time: 5.0
    joint_names: &joint_names_list
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - waist_yaw_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - waist_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - waist_pitch_joint
      - left_knee_joint
      - right_knee_joint
      - left_shoulder_pitch_joint
      - right_shoulder_pitch_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_shoulder_roll_joint
      - right_shoulder_roll_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
      - left_shoulder_yaw_joint
      - right_shoulder_yaw_joint
      - left_elbow_joint
      - right_elbow_joint
      - left_wrist_roll_joint
      - right_wrist_roll_joint
      - left_wrist_pitch_joint
      - right_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_wrist_yaw_joint
    joint_cfg:
        left_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1 }
        right_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1 }
        waist_yaw_joint: { kp: 200.0, kd: 5.0, default_pos: 0.0 }
        left_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
        right_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
        waist_roll_joint: { kp: 200.0, kd: 5.0, default_pos: 0.0 }
        left_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
        right_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
        waist_pitch_joint: { kp: 200.0, kd: 5.0, default_pos: 0.0 }
        left_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3 }
        right_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3 }
        left_shoulder_pitch_joint: { kp: 40.0, kd: 10.0, default_pos: 0.3 }
        right_shoulder_pitch_joint: { kp: 40.0, kd: 10.0, default_pos: 0.3 }
        left_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2 }
        right_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2 }
        left_shoulder_roll_joint: { kp: 40.0, kd: 10.0, default_pos: 0.25 }
        right_shoulder_roll_joint: { kp: 40.0, kd: 10.0, default_pos: -0.25 }
        left_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0 }
        right_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0 }
        left_shoulder_yaw_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }
        right_shoulder_yaw_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }
        left_elbow_joint: { kp: 40.0, kd: 10.0, default_pos: 0.97 }
        right_elbow_joint: { kp: 40.0, kd: 10.0, default_pos: 0.97 }
        left_wrist_roll_joint: { kp: 40.0, kd: 10.0, default_pos: 0.15 }
        right_wrist_roll_joint: { kp: 40.0, kd: 10.0, default_pos: -0.15 }
        left_wrist_pitch_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }
        right_wrist_pitch_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }
        left_wrist_yaw_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }
        right_wrist_yaw_joint: { kp: 40.0, kd: 10.0, default_pos: 0.0 }

# ------------------------------------------------------------
# RL Controller Legs (12 DOF)
# ------------------------------------------------------------
rl_controller_legs:
  ros__parameters:
    update_rate: 200
    use_gains: false
    rl_policy_package: g1_description
    rl_policy_path: config/rl/policy_12.onnx
    imu_names: ["imu-pelvis"]
    range_lin_vel_x: [-0.5, 1.0]
    range_lin_vel_y: [-0.3, 0.3]
    range_ang_vel_z: [-0.2, 0.2]
    obs_names: ["base_ang_vel", "projected_gravity", "velocity_commands", "joint_pos", "joint_vel", "actions"]
    obs_cfg:
      base_ang_vel: { clip: [-100.0, 100.0], scale: 0.2, history_length: 5 }
      projected_gravity: { clip: [-100.0, 100.0], scale: 1.0, history_length: 5 }
      velocity_commands: { clip: [-100.0, 100.0], scale: 1.0, history_length: 5 }
      joint_pos: { clip: [-100.0, 100.0], scale: 1.0, history_length: 5 }
      joint_vel: { clip: [-100.0, 100.0], scale: 0.05, history_length: 5 }
      actions: { clip: [-100.0, 100.0], scale: 1.0, history_length: 5 }
    joint_names:
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - left_knee_joint
      - right_knee_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
    action_cfg:
      left_hip_pitch_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: -0.1 }
      right_hip_pitch_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: -0.1 }
      left_hip_roll_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: 0.0 }
      right_hip_roll_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: 0.0 }
      left_hip_yaw_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: 0.0 }
      right_hip_yaw_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 100.0, kd: 2.0, default_pos: 0.0 }
      left_knee_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 150.0, kd: 4.0, default_pos: 0.3 }
      right_knee_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 150.0, kd: 4.0, default_pos: 0.3 }
      left_ankle_pitch_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 40.0, kd: 2.0, default_pos: -0.2 }
      right_ankle_pitch_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 40.0, kd: 2.0, default_pos: -0.2 }
      left_ankle_roll_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 40.0, kd: 2.0, default_pos: 0.0 }
      right_ankle_roll_joint: { clip: [-100.0, 100.0], scale: 0.25, kp: 40.0, kd: 2.0, default_pos: 0.0 }

