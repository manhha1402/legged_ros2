# Left arm controller (7 joints)
left_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: true
    command_interfaces:
    - position
    joints:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    state_interfaces:
    - position
    - velocity
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0

# Right arm controller (7 joints)
right_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: true
    command_interfaces:
    - position
    joints:
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
    state_interfaces:
    - position
    - velocity
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0

left_inspire_gripper_controller:
  ros__parameters:

    joint: inspire_gripper_joint1

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

right_inspire_gripper_controller:
  ros__parameters:
    use_sim_time: true

    joint: inspire_gripper_joint1

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu-pelvis  # must match the IMU name in URDF/xacro
    frame_id: pelvis
