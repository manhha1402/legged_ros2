unitree_node:
  ros__parameters:
    cmd_vel:
      scale:
        lin_vel_x: 0.3
        lin_vel_y: 0.3
        ang_vel_z: 0.2

controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    static_controller:
      type: legged_ros2_controller/StaticController
    rl_controller:
      type: legged_rl_controller/LeggedRLController
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
# -----------------
# Static Controller
# -----------------
static_controller:
  ros__parameters:
    traj_time: 5.0
    joint_names: &joint_names_list
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - left_knee_joint
      - right_knee_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
    joint_cfg:
      left_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1 }
      right_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1 }
      left_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
      right_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
      left_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
      right_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0 }
      left_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3 }
      right_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3 }
      left_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2 }
      right_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2 }
      left_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0 }
      right_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0 }

# -------------
# RL Controller
# -------------
rl_controller:
  ros__parameters:
    update_rate: 200 # 1/0.02s
    imu_names:
      - imu-pelvis
    range_lin_vel_x: [-0.5, 1.0]
    range_lin_vel_y: [-0.3, 0.3]
    range_ang_vel_z: [-0.2, 0.2]

    obs_names:
      - base_ang_vel
      - projected_gravity
      - velocity_commands
      - joint_pos
      - joint_vel
      - actions
    obs_cfg:
      base_ang_vel: { clip: [ -100.0, 100.0 ], scale: 0.2, history_length: 5 }
      projected_gravity: { clip: [ -100.0, 100.0 ], scale: 1.0, history_length: 5 }
      velocity_commands: { clip: [ -100.0, 100.0 ], scale: 1.0, history_length: 5 }
      joint_pos: { clip: [ -100.0, 100.0 ], scale: 1.0, history_length: 5 }
      joint_vel: { clip: [ -100.0, 100.0 ], scale: 0.05, history_length: 5 }
      actions: { clip: [ -100.0, 100.0 ], scale: 1.0, history_length: 5 }

    joint_names:
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - left_knee_joint
      - right_knee_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint

    action_cfg:
      left_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_hip_pitch_joint: { kp: 100.0, kd: 2.0, default_pos: -0.1, scale: 0.25, clip: [ -100.0, 100.0 ] }
      left_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_hip_roll_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }
      left_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_hip_yaw_joint: { kp: 100.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }
      left_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_knee_joint: { kp: 150.0, kd: 4.0, default_pos: 0.3, scale: 0.25, clip: [ -100.0, 100.0 ] }
      left_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_ankle_pitch_joint: { kp: 40.0, kd: 2.0, default_pos: -0.2, scale: 0.25, clip: [ -100.0, 100.0 ] }
      left_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }
      right_ankle_roll_joint: { kp: 40.0, kd: 2.0, default_pos: 0.0, scale: 0.25, clip: [ -100.0, 100.0 ] }

# Left arm trajectory controller (7 joints) - provides action server
left_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    command_interfaces:
      - effort
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
    state_interfaces:
      - position
      - velocity
    gains:
      left_shoulder_pitch_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_shoulder_roll_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_shoulder_yaw_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_elbow_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_wrist_roll_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_wrist_pitch_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      left_wrist_yaw_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0


# Right arm trajectory controller (7 joints) - provides action server
right_arm_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    command_interfaces:
      - effort
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    state_interfaces:
      - position
      - velocity
    gains:
      right_shoulder_pitch_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_shoulder_roll_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_shoulder_yaw_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_elbow_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_wrist_roll_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_wrist_pitch_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
      right_wrist_yaw_joint: { p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0 }
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0


imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu-pelvis  # must match the IMU name in URDF/xacro
    frame_id: pelvis
